name: Build and Deploy Tracker

on:
  push:
    branches:
      - main 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 # <-- Updated to v4

      - name: Setup Node.js
        uses: actions/setup-node@v4 # <-- Updated to v4
        with:
          node-version: '20' # <-- Updated to Node 20

      - name: Install Dependencies
        run: npm install

      - name: Build Frontend
        run: npm run build

      # Add your deployment steps here. 
      # For example, if deploying to Render, Vercel, or a VPS.
